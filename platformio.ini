[platformio]
default_envs = lilygo_t2can

[env:lilygo_t2can]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
extra_scripts = pre:scripts/platformio_build_info.py
lib_deps = 
    https://github.com/autowp/arduino-mcp2515.git
build_unflags = -std=gnu++11

build_flags = -std=gnu++17
    -D BOARD_T2CAN           ; [필수] 
    -D HW3                   ; [필수] 
    ;-D HW4                   ; 둘중 한개만 선택하세요.
    -D DRIVER_MCP2515        ; [필수] A채널(SPI칩) 드라이버 사용 선언
    -D DRIVER_TWAI           ; [필수] B채널(ESP32내장) 드라이버 사용 선언
    -D MCP2515_CRYSTAL_MHZ=16 ; [보드] MCP2515 크리스탈(8 또는 16)
    -D T2CAN_SPI_FREQ_HZ=10000000 ; [A기본] MCP2515 최대 정격. 웹 UI에서 8/10MHz 선택 가능
    -D T2CAN_MCP2515_ONE_SHOT_DEFAULT=1 ; [A보호 기본] 웹 UI에서 변경 가능
    -D T2CAN_A_TX_GUARD_DEFAULT=1 ; [A보호 기본] 웹 UI에서 변경 가능
    -D NAG_KILLER            ; [기능] 핸들 경고 삭제 기능 활성화
    -D SUMMON_UNLOCK         ; [기능] HW3 조건부 Summon Unlock 활성화
    -D ARDUINO_USB_MODE=1       
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEBUG_NAG_KILLER      ; [디버그] B채널 상태 모니터링 활성화 (로그링/Web UI에만 저장, 성능 영향 최소)

board_build.partitions = min_spiffs.csv
upload_protocol = esptool
monitor_speed = 115200

 
; =========================================================
; [이하 테스트용 환경]
; =========================================================
[env:native]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_src_filter = +<*> -<main.cpp>
test_ignore =
    test_native_nag
    test_native_hw4
    test_native_legacy
    test_native_hw3_autolc
build_flags = -std=c++17 -DNATIVE_BUILD -DHW3 -DISA_SPEED_CHIME_SUPPRESS -DEMERGENCY_VEHICLE_DETECTION -DSUMMON_UNLOCK
test_filter = test_native_*

[env:native_log_buffer]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_src_filter = +<*> -<main.cpp>
build_flags = -std=c++17 -DNATIVE_BUILD
test_filter = test_native_log_buffer

[env:native_nag]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_src_filter = +<*> -<main.cpp>
build_flags = -std=c++17 -DNATIVE_BUILD -DNAG_KILLER
test_filter = test_native_nag

[env:native_can_sim]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_src_filter = +<*> -<main.cpp>
build_flags = -std=c++17 -DNATIVE_BUILD -DNAG_KILLER
test_filter = test_native_can_sim
