[env:feather_rp2040_can]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_can
framework = arduino
extra_scripts = pre:scripts/platformio_sync_ino_defines.py
board_build.core = earlephilhower
lib_deps = autowp/autowp-mcp2515
build_flags = -DDRIVER_MCP2515

[env:feather_m4_can]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
extra_scripts = pre:scripts/platformio_sync_ino_defines.py
lib_deps = adafruit/Adafruit CAN
build_flags = -DDRIVER_SAME51 -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32_twai]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/platformio_sync_ino_defines.py
build_flags = -DDRIVER_TWAI -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32_feather_v2_mcp2515]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
extra_scripts = pre:scripts/platformio_sync_ino_defines.py
lib_deps = https://github.com/autowp/arduino-mcp2515
monitor_speed = 115200
build_flags = -DDRIVER_MCP2515 -DPIN_CAN_CS=14 -DPIN_CAN_INTERRUPT=32 -DPIN_LED=13 -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32_twai_nag_killer]
extends = env:esp32_twai
build_flags = ${env:esp32_twai.build_flags} -DNAG_KILLER
; LILYGO T-CAN485: TX=27, RX=26
; Connect to X179 pin 2/3 (CAN bus 4)

[env:lilygo_tcan485_nag_killer]
extends = env:esp32_twai
build_flags = ${env:esp32_twai.build_flags} -DNAG_KILLER -DTWAI_TX_PIN=GPIO_NUM_27 -DTWAI_RX_PIN=GPIO_NUM_26 -DPIN_LED=2

[env:lilygo_tcan485_hw3]
extends = env:esp32_twai
build_flags = ${env:esp32_twai.build_flags} -DHW3 -DFORCE_FSD -DISA_SPEED_CHIME_SUPPRESS -DTWAI_TX_PIN=GPIO_NUM_27 -DTWAI_RX_PIN=GPIO_NUM_26 -DPIN_LED=2
; LILYGO T-CAN485: TX=27, RX=26
; Connect to X179 pin 13/14 (CAN bus 6 / Body/Left CAN)

[env:m5stack-atomic-can-base]
extends = env:esp32_twai
board = m5stack-atom
build_flags = ${env:esp32_twai.build_flags} -DPIN_LED=27 -DTWAI_TX_PIN=GPIO_NUM_22 -DTWAI_RX_PIN=GPIO_NUM_19

[env:native]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD -DISA_SPEED_CHIME_SUPPRESS -DEMERGENCY_VEHICLE_DETECTION
test_ignore = test_native_force_fsd
test_filter = test_native_*

[env:native_force_fsd]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD -DISA_SPEED_CHIME_SUPPRESS -DEMERGENCY_VEHICLE_DETECTION -DFORCE_FSD
test_filter = test_native_force_fsd

[env:native_log_buffer]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD
test_filter = test_native_log_buffer

[env:native_nag]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD -DNAG_KILLER
test_filter = test_native_nag
